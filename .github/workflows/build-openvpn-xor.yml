name: Build OpenVPN XOR for OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      SDK_URL: https://downloads.openwrt.org/releases/23.05.0/targets/mediatek/mt7622/openwrt-sdk-23.05.0-mediatek-mt7622_gcc-12.3.0_musl.Linux-x86_64.tar.xz
      SDK_SHA256: 35bbaa7a5ee2eefc548fcf8cfae73ecf84a26d214257bd43b6dbeaeebd290e7c
      OPENWRT_BRANCH: openwrt-23.05

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            wget \
            file \
            zlib1g-dev

      - name: Download OpenWrt SDK
        run: |
          wget -O openwrt-sdk.tar.xz "$SDK_URL"
          echo "$SDK_SHA256  openwrt-sdk.tar.xz" | sha256sum -c -
          mkdir sdk
          tar -xJf openwrt-sdk.tar.xz --strip-components=1 -C sdk

      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace OpenVPN package
        working-directory: sdk
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/packages.git \
            packages-source

          rm -rf package/feeds/packages/openvpn
          cp -a packages-source/net/openvpn package/feeds/packages/openvpn

          sed -i 's/^PKG_RELEASE:=.*/PKG_RELEASE:=99/' \
            package/feeds/packages/openvpn/Makefile

          grep -E '^PKG_(VERSION|RELEASE):=' \
            package/feeds/packages/openvpn/Makefile

            - name: Add Tunnelblick XOR patches
        working-directory: sdk
        run: |
          set -euxo pipefail

          PATCH_DIR="package/feeds/packages/openvpn/patches"
          mkdir -p "$PATCH_DIR"

          BASE_URL="https://raw.githubusercontent.com/Tunnelblick/Tunnelblick/master/third_party/sources/openvpn/openvpn-2.5.8/patches"

          wget -O "$PATCH_DIR/999-xor-a.patch" \
            "$BASE_URL/02-tunnelblick-openvpn_xorpatch-a.diff"

          wget -O "$PATCH_DIR/999-xor-b.patch" \
            "$BASE_URL/03-tunnelblick-openvpn_xorpatch-b.diff"

          wget -O "$PATCH_DIR/999-xor-c.patch" \
            "$BASE_URL/04-tunnelblick-openvpn_xorpatch-c.diff"

          wget -O "$PATCH_DIR/999-xor-d.patch" \
            "$BASE_URL/05-tunnelblick-openvpn_xorpatch-d.diff"

          wget -O "$PATCH_DIR/999-xor-e.patch" \
            "$BASE_URL/06-tunnelblick-openvpn_xorpatch-e.diff"

          for patch_file in "$PATCH_DIR"/999-xor-*.patch; do
            echo "Downloaded: $patch_file"
            test -s "$patch_file"
            head -n 5 "$patch_file"
          done

      - name: Configure package
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_openvpn-openssl=y" > .config
          make defconfig

      - name: Download package sources
        working-directory: sdk
        run: |
          make package/openvpn/download V=s

      - name: Prepare patched sources
        working-directory: sdk
        run: |
          set -euxo pipefail
          make package/openvpn/clean V=s
          make package/openvpn/prepare V=s

          grep -Rni '"scramble"' build_dir
          grep -Rni 'xormethod' build_dir
          grep -Rni 'buffer_mask' build_dir

      - name: Build OpenVPN package
        working-directory: sdk
        run: |
          set -euxo pipefail
          make package/openvpn/compile V=sc -j"$(nproc)"

      - name: Verify package
        working-directory: sdk
        run: |
          set -euxo pipefail

          IPK="$(find bin -type f \
            -name 'openvpn-openssl_2.5.8-99_aarch64_cortex-a53.ipk' \
            -print -quit)"

          test -n "$IPK"
          echo "Built package: $IPK"

      - name: Collect artifacts
        run: |
          mkdir output
          find sdk/bin \
            -type f \
            -name 'openvpn-openssl_2.5.8-99_aarch64_cortex-a53.ipk' \
            -exec cp -v {} output/ \;

          sha256sum output/* > output/SHA256SUMS

      - name: Upload OpenVPN package
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-xor-openwrt-23.05.0-mt7622
          path: output/
          if-no-files-found: error
          retention-days: 30
