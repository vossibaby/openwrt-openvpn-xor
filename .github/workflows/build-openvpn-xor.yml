name: Build OpenVPN XOR for OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      SDK_URL: https://downloads.openwrt.org/releases/23.05.0/targets/mediatek/mt7622/openwrt-sdk-23.05.0-mediatek-mt7622_gcc-12.3.0_musl.Linux-x86_64.tar.xz
      SDK_SHA256: 35bbaa7a5ee2eefc548fcf8cfae73ecf84a26d214257bd43b6dbeaeebd290e7c
      OPENWRT_BRANCH: openwrt-23.05

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            wget \
            file \
            zlib1g-dev

      - name: Download OpenWrt SDK
        run: |
          wget -O openwrt-sdk.tar.xz "$SDK_URL"
          echo "$SDK_SHA256  openwrt-sdk.tar.xz" | sha256sum -c -
          mkdir sdk
          tar -xJf openwrt-sdk.tar.xz \
            --strip-components=1 \
            -C sdk

      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace OpenVPN package with OpenWrt 23.05 package
        working-directory: sdk
        run: |
          rm -rf package/openvpn
          git clone \
            --depth 1 \
            --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/packages.git \
            packages-source

          cp -a packages-source/net/openvpn package/openvpn

      - name: Add Tunnelblick XOR patch
        working-directory: sdk
        run: |
          mkdir -p package/openvpn/patches

          cat > package/openvpn/patches/999-openvpn-xor-scramble.patch <<'PATCH'
          --- a/src/openvpn/forward.c
          +++ b/src/openvpn/forward.c
          @@ -1110,6 +1110,10 @@ process_incoming_link_part1(struct context *c, struct link_socket_info *lsi, bool
               if (c->c2.buf.len > 0)
               {
          +        if (c->options.ce.xormethod > 0)
          +        {
          +            buffer_mask(&c->c2.buf, c->options.ce.xormask);
          +        }
                   if (!link_socket_verify_incoming_addr(&c->c2.buf, lsi, &c->c2.from))
                   {
                       link_socket_bad_incoming_addr(&c->c2.buf, lsi, &c->c2.from);
          @@ -1715,6 +1719,10 @@ process_outgoing_link(struct context *c)
                           socks_preprocess_outgoing_link(c, &to_addr, &size_delta);
                       }
          
          +            if (c->options.ce.xormethod > 0)
          +            {
          +                buffer_mask(&c->c2.to_link, c->options.ce.xormask);
          +            }
                       /* Send packet */
                       size = link_socket_write(c->c2.link_socket,
                                                &c->c2.to_link,
          --- a/src/openvpn/options.c
          +++ b/src/openvpn/options.c
          @@ -795,6 +795,7 @@ static const char usage_message[] =
               "--mark value            : Mark encrypted packets being sent with value. The mark value can be matched in policy routing and packetfilter rules.\n"
          +    "--scramble type [key]   : Enable XOR scrambling: xormask, xorptrpos, reverse or obfuscate.\n"
               "\n"
               "Tunnel Options:\n"
               "--local host             : Local host name or ip address. Implies --bind.\n"
          @@ -1455,6 +1456,8 @@ show_connection_entry(const struct connection_entry *o)
               SHOW_INT(bind_ipv6_only);
               SHOW_INT(connect_retry_seconds);
               SHOW_INT(connect_retry_seconds_max);
          +    SHOW_INT(xormethod);
          +    SHOW_STR(xormask);
               SHOW_INT(connect_timeout);
               SHOW_INT(connect_retry_max);
               SHOW_INT(local_port);
          @@ -6375,6 +6378,42 @@ add_option(struct options *options,
                   goto err;
               }
           }
          +    else if (streq(p[0], "scramble") && p[1] && !p[3])
          +    {
          +        VERIFY_PERMISSION(OPT_P_GENERAL|OPT_P_CONNECTION);
          +
          +        if (streq(p[1], "xormask") && p[2])
          +        {
          +            options->ce.xormethod = 1;
          +            options->ce.xormask = p[2];
          +        }
          +        else if (streq(p[1], "xorptrpos"))
          +        {
          +            options->ce.xormethod = 2;
          +        }
          +        else if (streq(p[1], "reverse"))
          +        {
          +            options->ce.xormethod = 3;
          +        }
          +        else if (streq(p[1], "obfuscate") && p[2])
          +        {
          +            options->ce.xormethod = 4;
          +            options->ce.xormask = p[2];
          +        }
          +        else
          +        {
          +            msg(msglevel,
          +                "Unknown scramble method or missing scramble key: %s",
          +                p[1]);
          +            goto err;
          +        }
          +    }
               else if (streq(p[0], "http-proxy") && p[1] && !p[5])
               {
                   struct http_proxy_options *ho;
          --- a/src/openvpn/options.h
          +++ b/src/openvpn/options.h
          @@ -132,6 +132,9 @@ struct connection_entry
               int connect_retry_seconds;
               int connect_retry_seconds_max;
          
          +    int xormethod;
          +    const char *xormask;
          +
               int connect_timeout;
               int connect_retry_max;
          
          --- a/src/openvpn/socket.c
          +++ b/src/openvpn/socket.c
          @@ -56,6 +56,48 @@
           #include "memdbg.h"
          
          +void
          +buffer_mask(struct buffer *buf, const char *mask)
          +{
          +    int i;
          +    const int mask_len = strlen(mask);
          +
          +    if (mask_len <= 0)
          +    {
          +        return;
          +    }
          +
          +    for (i = 0; i < BLEN(buf); i++)
          +    {
          +        BPTR(buf)[i] ^= mask[i % mask_len];
          +    }
          +}
          +
          +void
          +buffer_xorptrpos(struct buffer *buf)
          +{
          +    int i;
          +
          +    for (i = 0; i < BLEN(buf); i++)
          +    {
          +        BPTR(buf)[i] ^= (uint8_t) i;
          +    }
          +}
          +
          +void
          +buffer_reverse(struct buffer *buf)
          +{
          +    int i;
          +
          +    for (i = 0; i < BLEN(buf) / 2; i++)
          +    {
          +        const uint8_t tmp = BPTR(buf)[i];
          +        BPTR(buf)[i] = BPTR(buf)[BLEN(buf) - i - 1];
          +        BPTR(buf)[BLEN(buf) - i - 1] = tmp;
          +    }
          +}
          +
           const int proto_overhead[] = {
               0,
               IPv4_UDP_HEADER_SIZE,
          --- a/src/openvpn/socket.h
          +++ b/src/openvpn/socket.h
          @@ -35,6 +35,11 @@
           #include "proxy.h"
           #include "socks.h"
          
          +void buffer_mask(struct buffer *buf, const char *mask);
          +void buffer_xorptrpos(struct buffer *buf);
          +void buffer_reverse(struct buffer *buf);
          +
           /*
            * OpenVPN's default port number as assigned by IANA.
            */
          PATCH

      - name: Configure package
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_openvpn-openssl=y" > .config
          make defconfig

      - name: Download package sources
        working-directory: sdk
        run: |
          make package/openvpn/download V=s

      - name: Build OpenVPN package
        working-directory: sdk
        run: |
          make package/openvpn/clean V=s
          make package/openvpn/compile V=sc -j"$(nproc)"

      - name: Verify resulting binary
        working-directory: sdk
        run: |
          find bin -type f -name 'openvpn-openssl_*.ipk' -print
          test -n "$(find bin -type f -name 'openvpn-openssl_*.ipk' -print -quit)"

      - name: Collect artifacts
        run: |
          mkdir output
          find sdk/bin \
            -type f \
            -name 'openvpn-openssl_*.ipk' \
            -exec cp -v {} output/ \;

          sha256sum output/* > output/SHA256SUMS

      - name: Upload OpenVPN package
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-xor-openwrt-23.05.0-mt7622
          path: output/
          if-no-files-found: error
          retention-days: 30
