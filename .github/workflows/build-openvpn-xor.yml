name: Build OpenVPN XOR for OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      SDK_URL: https://downloads.openwrt.org/releases/23.05.0/targets/mediatek/mt7622/openwrt-sdk-23.05.0-mediatek-mt7622_gcc-12.3.0_musl.Linux-x86_64.tar.xz
      SDK_SHA256: 35bbaa7a5ee2eefc548fcf8cfae73ecf84a26d214257bd43b6dbeaeebd290e7c
      OPENWRT_BRANCH: openwrt-23.05

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            wget \
            file \
            patch \
            zlib1g-dev

      - name: Download OpenWrt SDK
        run: |
          set -euxo pipefail

          wget -O openwrt-sdk.tar.xz "$SDK_URL"

          echo "$SDK_SHA256  openwrt-sdk.tar.xz" \
            | sha256sum -c -

          mkdir sdk

          tar -xJf openwrt-sdk.tar.xz \
            --strip-components=1 \
            -C sdk

      - name: Update OpenWrt feeds
        working-directory: sdk
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace OpenVPN package
        working-directory: sdk
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/packages.git \
            packages-source

          rm -rf package/feeds/packages/openvpn

          mkdir -p package/feeds/packages

          cp -a \
            packages-source/net/openvpn \
            package/feeds/packages/openvpn

          sed -i \
            's/^PKG_RELEASE:=.*/PKG_RELEASE:=99/' \
            package/feeds/packages/openvpn/Makefile

          grep -E \
            '^PKG_(VERSION|RELEASE):=' \
            package/feeds/packages/openvpn/Makefile

      - name: Add OpenVPN XOR patches
        working-directory: sdk
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            https://github.com/egc112/OpenWRT-egc-add-on.git \
            egc-add-on

          PATCH_SOURCE="egc-add-on/openvpn-scramble/feeds/515"
          PATCH_DEST="package/feeds/packages/openvpn/patches"

          test -d "$PATCH_SOURCE"

          mkdir -p "$PATCH_DEST"

          find "$PATCH_SOURCE" \
            -maxdepth 1 \
            -type f \
            \( -name '*.patch' -o -name '*.diff' \) \
            -print

          PATCH_COUNT="$(
            find "$PATCH_SOURCE" \
              -maxdepth 1 \
              -type f \
              \( -name '*.patch' -o -name '*.diff' \) \
              | wc -l
          )"

          test "$PATCH_COUNT" -gt 0

          cp -v \
            "$PATCH_SOURCE"/*.patch \
            "$PATCH_DEST"/

          echo "Copied XOR patches: $PATCH_COUNT"

          ls -lah "$PATCH_DEST"

      - name: Configure OpenVPN package
        working-directory: sdk
        run: |
          set -euxo pipefail

          cat > .config <<'EOF'
          CONFIG_PACKAGE_openvpn-openssl=y
          EOF

          make defconfig

          grep \
            '^CONFIG_PACKAGE_openvpn-openssl=y' \
            .config

      - name: Download OpenVPN sources
        working-directory: sdk
        run: |
          set -euxo pipefail

          make package/openvpn/download V=s

      - name: Prepare patched OpenVPN sources
        working-directory: sdk
        run: |
          set -euxo pipefail

          make package/openvpn/clean V=s
          make package/openvpn/prepare V=sc

          BUILD_DIR="$(
            find build_dir \
              -type d \
              -path '*openvpn-openssl/openvpn-2.5.8' \
              -print \
              -quit
          )"

          test -n "$BUILD_DIR"

          echo "OpenVPN build directory: $BUILD_DIR"

          grep -Rni \
            --include='*.c' \
            --include='*.h' \
            --include='*.rst' \
            --include='*.txt' \
            'scramble' \
            "$BUILD_DIR"

          grep -Rni \
            --include='*.c' \
            --include='*.h' \
            'xormethod' \
            "$BUILD_DIR"

          echo "XOR patches successfully applied."

      - name: Build OpenVPN package
        working-directory: sdk
        run: |
          set -euxo pipefail

          make package/openvpn/compile \
            V=sc \
            -j"$(nproc)"

      - name: Find built package
        working-directory: sdk
        run: |
          set -euxo pipefail

          find bin \
            -type f \
            -name 'openvpn-openssl_*.ipk' \
            -print

          IPK="$(
            find bin \
              -type f \
              -name 'openvpn-openssl_2.5.8-99_aarch64_cortex-a53.ipk' \
              -print \
              -quit
          )"

          test -n "$IPK"

          echo "Built package: $IPK"

          cp "$IPK" "$GITHUB_WORKSPACE/openvpn-xor.ipk"

      - name: Verify XOR inside binary
        run: |
          set -euxo pipefail

          rm -rf extracted-ipk
          mkdir extracted-ipk
          cd extracted-ipk

          ar x "$GITHUB_WORKSPACE/openvpn-xor.ipk"

          mkdir rootfs

          DATA_ARCHIVE="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name 'data.tar.*' \
              -print \
              -quit
          )"

          test -n "$DATA_ARCHIVE"

          tar -xf "$DATA_ARCHIVE" -C rootfs

          test -x rootfs/usr/sbin/openvpn

          strings rootfs/usr/sbin/openvpn \
            | grep -i 'scramble'

          strings rootfs/usr/sbin/openvpn \
            | grep -i 'obfuscate'

          echo "OpenVPN binary contains XOR scramble support."

      - name: Collect artifacts
        run: |
          set -euxo pipefail

          mkdir -p output

          cp \
            openvpn-xor.ipk \
            output/openvpn-openssl_2.5.8-99_aarch64_cortex-a53.ipk

          sha256sum \
            output/openvpn-openssl_2.5.8-99_aarch64_cortex-a53.ipk \
            > output/SHA256SUMS

          ls -lah output

      - name: Upload OpenVPN package
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-xor-openwrt-23.05.0-mt7622
          path: output/
          if-no-files-found: error
          retention-days: 30
